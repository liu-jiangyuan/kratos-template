syntax = "proto3";
package kratos.api;

option go_package = "core/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Log log = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // Driver name registered with database/sql, e.g. "postgres", "pgx", "mysql".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Log {
  message File {
    string path = 1;
  }
  message Database {
    // HTTP API endpoint for log database (e.g. Elasticsearch, ZincSearch).
    string endpoint = 1;
    string method = 2;
    map<string, string> headers = 3;
    google.protobuf.Duration timeout = 4;
  }
  // Output driver: "console" (default), "file", or "database".
  string driver = 1;
  // Minimum log level: "debug", "info" (default), "warn", "error".
  string level = 2;
  // Log format: "text" (default), "json", or a custom template string
  // such as "{time} [{level}] [req={request_id}] [trace={trace_id}] {caller} - {msg} {attrs}".
  string format = 3;
  // Time layout for formatted timestamps (defaults to time.RFC3339).
  string time_format = 4;
  // Whether to include source file:line in log records.
  bool add_source = 5;
  File file = 6;
  Database database = 7;
}
