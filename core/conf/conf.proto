syntax = "proto3";
package kratos.api;

option go_package = "core/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Log log = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
}

// Data is optional. The demo runs with an in-memory repository; uncomment the
// data section in configs/config.yaml (and wire core/data.ProviderSet) when a
// concrete project needs a database or Redis.
message Data {
  message Database {
    // Driver name registered with database/sql, e.g. "postgres", "pgx", "mysql".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
    // Connection pool settings (0 uses sensible defaults in core/data).
    int32 max_open_conns = 5;
    int32 max_idle_conns = 6;
    google.protobuf.Duration conn_max_lifetime = 7;
    google.protobuf.Duration conn_max_idle_time = 8;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Log {
  message File {
    string path = 1;
  }
  message Database {
    // HTTP API endpoint for log database (e.g. Elasticsearch, ZincSearch).
    string endpoint = 1;
    string method = 2;
    map<string, string> headers = 3;
    google.protobuf.Duration timeout = 4;
  }
  // Output driver: "console" (default), "file", or "database".
  string driver = 1;
  // Minimum log level: "debug", "info" (default), "warn", "error".
  string level = 2;
  // Log format: "json" (default), "text", or a custom template string
  // such as "{time} [{level}] [req={request_id}] [trace={trace_id}] {caller} - {msg} {attrs}".
  string format = 3;
  // Time layout for formatted timestamps (defaults to "2006-01-02 15:04:05").
  string time_format = 4;
  // Whether to include source file:line in log records.
  bool add_source = 5;
  File file = 6;
  Database database = 7;
  // Disable ANSI colors in console output (useful in containers/CI).
  bool no_color = 8;
}
