server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: postgres
    source: ${DATABASE_SOURCE:postgres://postgres:postgres@127.0.0.1:5432/kratos?sslmode=disable}
    # Development conveniences. Keep both false in production and apply schema
    # changes as a separate reviewed step.
    debug: true
    auto_migrate: true
log:
  # Output driver: "console" (terminal), "file" (local file), or "database" (HTTP log DB API such as ES/ZincSearch)
  driver: ${LOG_DRIVER:console}
  level: ${LOG_LEVEL:info}
  # Format: "text", "json", or custom template e.g. "{time} [{level}] [req={request_id}] [trace={trace_id}] {caller} - {msg} {attrs}"
  format: ${LOG_FORMAT:text}
  time_format: "2006-01-02T15:04:05.000Z07:00"
  add_source: true
  file:
    path: ./logs/app.log
  database:
    endpoint: ${LOG_DB_ENDPOINT:http://127.0.0.1:4080/api/app_logs/_doc}
    method: POST
    timeout: 5s
