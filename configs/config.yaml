# Demo runs as a single HTTP service with an in-memory repository.
server:
  http:
    addr: 0.0.0.0:8000
    timeout: 5s
log:
  # Output driver: "console" (terminal), "file" (local file), or "database" (HTTP log DB API such as ES/ZincSearch)
  driver: ${LOG_DRIVER:console}
  level: ${LOG_LEVEL:info}
  # Format: "json" (default), "text", or custom template e.g. "{time} [{level}] [req={request_id}] [trace={trace_id}] {caller} - {msg} {attrs}"
  format: ${LOG_FORMAT:json}
  time_format: "2006-01-02 15:04:05"
  add_source: true
  file:
    path: ./logs/app.log
  database:
    endpoint: ${LOG_DB_ENDPOINT:http://127.0.0.1:4080/api/app_logs/_doc}
    method: POST
    timeout: 5s

# Optional database wiring. Uncomment together with core/data.ProviderSet and
