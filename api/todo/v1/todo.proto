syntax = "proto3";

package todo.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "api/todo/v1;v1";

// TodoService is the HTTP demo CRUD API. Requests are JSON; responses use the
// template envelope described in README.md (code/message/data + HTTP status rules).
service TodoService {
  // CreateTodo creates a new todo item and returns the stored record with the
  // server-assigned id, created_at, and updated_at populated.
  rpc CreateTodo (CreateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      post: "/v1/todos"
      body: "todo"
    };
  }

  // ListTodos returns a page of todo items in creation order. Use the
  // next_page_token from TodoSet to retrieve subsequent pages.
  rpc ListTodos (ListTodosRequest) returns (TodoSet) {
    option (google.api.http) = {
      get: "/v1/todos"
    };
  }

  // GetTodo returns a single todo item by its id.
  rpc GetTodo (GetTodoRequest) returns (Todo) {
    option (google.api.http) = {
      get: "/v1/todos/{id}"
    };
  }

  // UpdateTodo applies a partial update using a FieldMask. Only the fields
  // listed in update_mask are overwritten. In HTTP, update_mask is passed as
  // the query parameter update_mask (comma-separated paths, e.g.
  // ?update_mask=title,completed); the body carries todo.
  rpc UpdateTodo (UpdateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      patch: "/v1/todos/{todo.id}"
      body: "todo"
    };
  }

  // DeleteTodo soft-deletes a todo item by its id. The record is retained in
  // the demo store but no longer appears in GetTodo or ListTodos results.
  rpc DeleteTodo (DeleteTodoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/todos/{id}"
    };
  }
}

// TodoStatus is the lifecycle state of a todo item.
enum TodoStatus {
  // Default value. Never returned by the server.
  TODO_STATUS_UNSPECIFIED = 0;
  // The item is live and appears in reads.
  TODO_STATUS_ACTIVE = 1;
  // The item has been soft-deleted and is hidden from reads.
  TODO_STATUS_DELETED = 2;
}

// Todo is the canonical representation of a todo item.
message Todo {
  // Application-generated UUIDv7 identifier. Read-only on create.
  string id = 1;
  // Short human-readable title.
  string title = 2;
  // Detailed description or notes.
  string content = 3;
  // Whether the todo item has been completed.
  bool completed = 4;
  // Server-assigned creation time. Read-only.
  google.protobuf.Timestamp created_at = 5;
  // Server-assigned last-modified time. Read-only.
  google.protobuf.Timestamp updated_at = 6;
  // Lifecycle state. Server-assigned; use DeleteTodo to delete.
  TodoStatus status = 7;
}

// TodoSet is a paginated collection returned by ListTodos.
message TodoSet {
  // The page of todo items, oldest first.
  repeated Todo todos = 1;
  // Token for the next page via ListTodosRequest.page_token. Empty when there
  // are no more results.
  string next_page_token = 2;
}

// CreateTodoRequest is the input for TodoService.CreateTodo.
message CreateTodoRequest {
  // The todo item to create. id, created_at, and updated_at are ignored and
  // populated by the server.
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetTodoRequest is the input for TodoService.GetTodo.
message GetTodoRequest {
  // Unique identifier of the todo item.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListTodosRequest is the input for TodoService.ListTodos.
message ListTodosRequest {
  // Optional. Maximum number of items per page. The server applies a default
  // (20) and a maximum (1000).
  int32 page_size = 1;
  // Optional. Token from a previous next_page_token.
  string page_token = 2;
}

// UpdateTodoRequest is the input for TodoService.UpdateTodo.
message UpdateTodoRequest {
  // The todo carrying the new field values. todo.id identifies the target and
  // is also bound from the HTTP path.
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
  // Field paths to overwrite. Use `*` to replace every mutable field.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// DeleteTodoRequest is the input for TodoService.DeleteTodo.
message DeleteTodoRequest {
  // Unique identifier of the todo item to delete.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}
